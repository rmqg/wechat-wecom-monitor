name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查标签与版本一致
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: 安装测试依赖
        run: python -m pip install -r requirements-dev.txt -r requirements-live.txt -r requirements-files.txt
      - name: 运行全量单元测试
        run: python -m pytest tests wechat/test_file_text.py wecom/collector
      - name: 发布前合成测试与离线检查
        env:
          MONITOR_CONFIG: ${{ runner.temp }}/monitor/config.json
          STATE_FILE: ${{ runner.temp }}/monitor/seen.json
        run: |
          sh install.sh --non-interactive
          python bin/wechat-wecom-monitor demo --output "$RUNNER_TEMP/demo"
          python bin/wechat-wecom-monitor doctor --config "$MONITOR_CONFIG"
          python bin/wechat-wecom-monitor check --export-root "$RUNNER_TEMP/demo/wechat" --config "$MONITOR_CONFIG" --dry-run
          python bin/wechat-wecom-monitor check --export-root "$RUNNER_TEMP/demo/wecom" --config "$MONITOR_CONFIG" --dry-run
      - name: 审计并从 Git 提交构建源码包
        run: sh scripts/build-release.sh
      - name: 校验 SHA256SUMS
        run: cd dist && sha256sum -c SHA256SUMS
      - name: 生成构建来源证明（Attestation）
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --title "wechat-wecom-monitor ${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
